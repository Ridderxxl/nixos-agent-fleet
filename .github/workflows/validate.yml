name: Validate public reference
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate documentation and machine model
        run: python3 tools/validate.py
